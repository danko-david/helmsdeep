apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web-app-deployment
  namespace: ${NAMESPACE}
  labels:
    app: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-web-app
  template:
    metadata:
      labels:
        app: demo-web-app
    spec:
      containers:
      - name: web-container
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web-app-service
  namespace: ${NAMESPACE}
spec:
  selector:
    app: demo-web-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
