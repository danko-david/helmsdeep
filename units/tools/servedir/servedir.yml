apiVersion: v1
kind: Pod
metadata:
  name: ${NAME}-servedir
  namespace: ${NAMESPACE}
  labels:
    app: ${NAME}-servedir
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    # Inline initialization script to build runtime configuration dynamically
    command: ["/bin/sh", "-c"]
    args:
    - |
      # Build the virtual host file cleanly escaping internal variables with a backslash
      cat << EOF > /etc/nginx/conf.d/default.conf
      server {
          listen 80;
          server_name localhost;

          location / {
              root /usr/share/nginx/html;
              index index.html index.htm;
              autoindex ${AUTOINDEX};
              autoindex_exact_size off;
              autoindex_localtime on;
          }
      }
      EOF

      echo "[INFO] Nginx configuration generated. Starting daemon..."
      exec nginx -g "daemon off;"
    ports:
    - containerPort: 80
      name: http
    volumeMounts:
    - name: ${NAME}-servedir-storage
      mountPath: /usr/share/nginx/html
      readOnly: true
  volumes:
  - name: ${NAME}-servedir-storage
    hostPath:
      path: ${SERVE_PATH}
      type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: ${NAME}-servedir-service
  namespace: ${NAMESPACE}
spec:
  selector:
    app: ${NAME}-servedir
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80