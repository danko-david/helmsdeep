apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ${NAME}-redirect-middleware
  namespace: ${NAMESPACE}
spec:
  redirectRegex:
    regex: "^https?://[^/]+/(.*)"
    replacement: "${REDIRECT_TARGET}/${1}"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ${NAME}-redirect-ingressroute
  namespace: ${NAMESPACE}
  annotations:
    ingress_name: "${NAME}"
    ingress_host: "${INGRESS_HOST}"
    redirect_target: "${REDIRECT_TARGET}"
spec:
  entryPoints:
    - ${INGRESS_ENTRYPOINT}
  routes:
  - match: Host(`${INGRESS_HOST}`)
    kind: Rule
    services:
    - name: ${NAME}-placeholder-service
      port: 80
      nativeLB: true
    middlewares:
    - name: ${NAME}-redirect-middleware
---
apiVersion: v1
kind: Service
metadata:
  name: ${NAME}-placeholder-service
  namespace: ${NAMESPACE}
spec:
  ports:
  - name: http
    port: 80
    targetPort: 80