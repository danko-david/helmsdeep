apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: l4-bridge-${SERVICE}
  namespace: ${NAMESPACE}
  labels:
    app: l4-bridge-${SERVICE}
spec:
  selector:
    matchLabels:
      app: l4-bridge-${SERVICE}
  template:
    metadata:
      labels:
        app: l4-bridge-${SERVICE}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet      
      containers:
      - name: nginx-proxy
        image: nginx:alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          cat << 'EOF' > /etc/nginx/nginx.conf
          user nginx;
          worker_processes auto;
          error_log /var/log/nginx/error.log notice;
          pid /var/run/nginx.pid;

          events {
              worker_connections 1024;
          }

          stream {
              server {
                  listen ${BIND_ADDRESS}:${PORT} ${UDP_FLAG};
                  proxy_pass ${SERVICE}.${NAMESPACE}.svc.cluster.local:${SERVICE_PORT};
                  proxy_timeout 10m;
                  proxy_connect_timeout 10s;
              }
          }
          EOF
          echo "[INFO] Starting Nginx L4 Stream Proxy..."
          exec nginx -g "daemon off;"
        
        securityContext:
          capabilities:
            add: ["NET_BIND_SERVICE"]
        ports:
        - name: l4-traffic
          containerPort: ${PORT}
          hostPort: ${PORT}
          protocol: ${TYPE}
